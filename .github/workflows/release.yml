name: Publish release to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Check tag matches package version
        run: |
          uv run --no-project python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag and package version differ"
          PY

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Test and lint
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Build distributions
        run: uv build --no-sources

      - name: Check wheel CLI outside the source project
        run: uv run --isolated --no-project --with dist/*.whl wx-downloder --version

      - name: Check source distribution CLI outside the source project
        run: uv run --isolated --no-project --with dist/*.tar.gz wx-downloder --help

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wx-downloder/
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
